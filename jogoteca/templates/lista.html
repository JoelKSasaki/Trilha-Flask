{% extends "template.html" %}
{% block content %}
      <table class="table table-striped table-responsive table-bordered">
         <thead class="thead-default">
            <tr>
                <th>Jogo</th>
                <th>Descrição</th>                
                <th>Gênero</th>
            </tr>
        </thead>
        <tbody>
            {% for jogo in jogos %}
           <tr>
              <td>{{jogo.nome}}</td>
              <td>{{jogo.descricao}}</td>              
              <td>{{jogo.genero}}</td>
           </tr>
           {% endfor %}
        </tbody>
     </table>
{% endblock %}
