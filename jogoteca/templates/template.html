<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogoteca</title>
    <!--<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">-->
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <!--url_for('nome da pasta', filename='arquivo X a ser encontrado'): encontra o arquivo desejado independente da hierarquia complexa das pastas na qual ele está inserido
    É o chamado link dinâmico-->
</head>
<body>
    <div class="container">

        {% with messages = get_flashed_messages() %}
            {% if messages %} 
                <ul id="messages" class="list-unstyled">
                {% for message in messages %}
                    <li class="alert alert-success">{{ message }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

            <div class="page-header">
                <h1>{{titulo}}</h1>
            </div>  
        
        {% block content %}
        {% endblock %}
        <!-- herança de templates: diminui os códigos repetidos em HTMLs diferentes-->

    </div>
</body>
</html>
